plugins {
    id 'com.android.application'
}

// Définir buildTime AVANT android { }
def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("UTC"))
def versionMajor = project.VERSION_MAJOR.toInteger()
def versionMinor = project.VERSION_MINOR.toInteger()
def versionPatch = project.VERSION_PATCH.toInteger()
def appBundleBaseName = "CosmoNote"

// Charger signing.properties s'il existe
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace 'com.cosmonote.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.cosmonote.app"
        minSdk 26
        targetSdk 35

        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        // Injecte la date de build comme constante Java
        buildConfigField "String", "BUILD_DATE", "\"${buildTime}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def configuredStoreFile = signingProps.getProperty('STORE_FILE')
            File resolvedStoreFile
            if (configuredStoreFile != null && !configuredStoreFile.trim().isEmpty()) {
                File candidate = new File(configuredStoreFile)
                resolvedStoreFile = candidate.isAbsolute() ? candidate : rootProject.file(configuredStoreFile)
            } else {
                resolvedStoreFile = rootProject.file('keystore/cosmonote-release.jks')
            }
            storeFile resolvedStoreFile
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: signingProps.getProperty('STORE_PASSWORD', "")
            keyAlias System.getenv("KEY_ALIAS") ?: signingProps.getProperty('KEY_ALIAS', "cosmonote")
            keyPassword System.getenv("KEY_PASSWORD") ?: signingProps.getProperty('KEY_PASSWORD', "")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'commons-codec:commons-codec:1.22.0'

    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth:23.2.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.3.0'

}

apply plugin: 'com.google.gms.google-services'

tasks.register("renameReleaseBundle", Copy) {
    dependsOn "bundleRelease"
    from("$buildDir/outputs/bundle/release")
    include("app-release.aab")
    into(rootProject.file("release-artifacts"))
    rename { String _ ->
        "${appBundleBaseName}-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})-release.aab"
    }
}

afterEvaluate {
    def bundleReleaseTask = tasks.findByName("bundleRelease")
    if (bundleReleaseTask != null) {
        bundleReleaseTask.finalizedBy(tasks.named("renameReleaseBundle"))
    }
}

